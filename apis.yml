name: Nationwide Building Society
kind: company
description: Nationwide Building Society is the world's largest building society and
  one of the UK's biggest retail financial services providers, headquartered in Swindon,
  England. As a mutual it is owned by and run for the benefit of its members rather
  than external shareholders, offering current accounts, mortgages, savings, and
  personal loans across a large branch and digital network. Nationwide is authorised
  by the Prudential Regulation Authority and regulated by the Financial Conduct
  Authority and the PRA. As one of the CMA9 - the nine largest current-account
  providers mandated by the UK Competition and Markets Authority to deliver Open
  Banking - Nationwide operates a public developer portal that publishes UK Open
  Banking APIs conformant to the Open Banking Implementation Entity (OBIE)
  standards - public, unauthenticated Open Data APIs (ATM and branch locators, personal and
  business current account product reference data) and FAPI-secured Read/Write APIs
  for Account and Transaction Information (AIS), Payment Initiation (PIS),
  Confirmation of Funds (CBPII), and Variable Recurring Payments (VRP), secured
  with OAuth2/OIDC, mutual-TLS client authentication, and PSD2 strong customer
  authentication using OBIE/eIDAS certificates.
