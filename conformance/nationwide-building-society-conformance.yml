- id: http-conditional-requests
  name: HTTP conditional requests (RFC 7232)
  conforms: true
  evidence: Open Data GET supports If-Modified-Since / If-None-Match / ETag / 304.
- id: rfc9457-problem-details
  name: RFC 9457 Problem Details
  conforms: false
