overlay: 1.0.0
info:
  title: API Evangelist enhancements for Nationwide Branch Locator (OBIE Open Data)
  version: 1.0.0
extends: openapi/obie-open-data-branch-locator-openapi.json
actions:
- target: $.info
  update:
    x-apievangelist-provider: Nationwide Building Society
    x-apievangelist-standard: OBIE Open Data API
    x-apievangelist-tier: open-data
    x-apievangelist-auth: none (public, unauthenticated)
    x-apievangelist-confirmed-host: https://openapi.nationwide.co.uk/open-banking/v2.2
    x-apievangelist-confirmed-live: false
- target: $.paths['/branches'].get
  update:
    operationId: listBranches
    x-apievangelist-note: Documented Open Data path; v2.2 branches returned HTTP 403 to anonymous probe from this environment.
